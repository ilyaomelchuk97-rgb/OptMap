<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OptMap — офлайн-карта</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="map"></div>
<div id="labels" class="labels"></div>

<!-- Верхняя панель -->
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path fill="currentColor" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
    </svg>
    <span>OptMap</span>
  </div>

  <div class="searchbox">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5A4.5 4.5 0 0 1 9.5 14z"/>
    </svg>
    <input id="search" type="text" placeholder="Адрес, улица, объект…  ( / )"
           autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
    <div id="search-results" class="dropdown" hidden></div>
  </div>

  <div class="topbar-actions">
    <button id="btn-route" class="btn" title="Маршруты">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 17h18v2H3v-2zm0 4h8v-2H3v2zM12 3C7.6 3 4 4.86 4 7.2c0 .9.6 1.73 1.6 2.4L4 15h3l1.2-4c.5.06 1.03.1 1.8.1V21h2V11.1c.77 0 1.3-.04 1.8-.1L15 15h3l-1.6-5.4c1-.67 1.6-1.5 1.6-2.4C20 4.86 16.4 3 12 3z"/></svg>
      Маршрут
    </button>
    <button id="btn-theme" class="btn icon" title="Тёмная / светлая тема">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26a5.4 5.4 0 0 1-5.4-5.4c0-1.81.9-3.4 2.26-4.4C12.92 3.04 12.46 3 12 3z"/></svg>
    </button>
  </div>
</header>

<!-- Панель маршрута -->
<aside id="route-panel" class="panel" hidden>
  <div class="panel-head">
    <strong>Маршрут</strong>
    <button id="route-close" class="btn icon small" title="Закрыть">✕</button>
  </div>

  <div class="route-modes">
    <label><input type="radio" name="mode" value="car" checked> Авто</label>
    <label><input type="radio" name="mode" value="foot"> Пешком</label>
  </div>

  <div class="route-points">
    <div class="rp">
      <span class="dot a">А</span>
      <input id="route-from" type="text" placeholder="Откуда" autocomplete="off">
      <button id="pick-from" class="btn icon small" title="Указать на карте">⌖</button>
      <div class="dropdown" id="dd-from" hidden></div>
    </div>
    <div class="rp">
      <span class="dot b">Б</span>
      <input id="route-to" type="text" placeholder="Куда" autocomplete="off">
      <button id="pick-to" class="btn icon small" title="Указать на карте">⌖</button>
      <div class="dropdown" id="dd-to" hidden></div>
    </div>
  </div>

  <div class="route-actions">
    <button id="route-swap" class="btn small" title="Поменять местами">⇅</button>
    <button id="route-build" class="btn primary">Построить</button>
  </div>

  <div id="route-summary" class="route-summary" hidden></div>
  <ol id="route-steps" class="route-steps"></ol>
</aside>

<!-- Нижняя панель -->
<footer class="statusbar">
  <span id="coords" class="status">—</span>
  <span class="sep"></span>
  <span id="zoomlabel" class="status">z—</span>
  <span class="sep"></span>
  <span id="scalebar" class="scalebar"><i id="scalebar-fill"></i><b id="scale">—</b></span>
  <span class="grow"></span>
  <span id="offline-badge" class="badge" title="Все данные карты хранятся локально">⚡ офлайн-данные</span>
  <span id="attribution" class="attribution"></span>
</footer>

<!-- Правые controls -->
<div class="map-controls">
  <button id="btn-locate" class="btn icon" title="Моё местоположение">
    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8zm8.94 3A9.01 9.01 0 0 0 13 3.06V1h-2v2.06A9.01 9.01 0 0 0 3.06 11H1v2h2.06A9.01 9.01 0 0 0 11 20.94V23h2v-2.06A9.01 9.01 0 0 0 20.94 13H23v-2h-2.06zM12 19a7 7 0 1 1 0-14a7 7 0 0 1 0 14z"/></svg>
  </button>
  <button id="btn-zoom-in" class="btn icon" title="Приблизить">＋</button>
  <button id="btn-zoom-out" class="btn icon" title="Отдалить">－</button>
  <button id="btn-reset" class="btn icon" title="В начало">
    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
  </button>
</div>

<div id="popup" class="popup" hidden></div>

<script src="/vendor/maplibre-gl.js"></script>
<script src="/app.js"></script>
</body>
</html>
